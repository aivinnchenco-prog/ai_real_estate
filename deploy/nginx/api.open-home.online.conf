# Open Home multi-agent API — HTTP only.
# Certbot will add SSL listen 443 + redirect after:
#   sudo bash deploy/finish_https.sh
#
# Do not put secrets in this file.
# Upstream is loopback only — never expose port 8000 publicly.

server {
    listen 80;
    listen [::]:80;
    server_name api.open-home.online;

    server_tokens off;
    client_max_body_size 2m;
    autoindex off;

    access_log /var/log/nginx/api.open-home.online.access.log;
    error_log  /var/log/nginx/api.open-home.online.error.log;

    # Process liveness — no auth, no upstream CRM/browser deps beyond the API process.
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    location /webhooks/amo-chat/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }

    # Deny everything else on this API host for now (public website is elsewhere).
    location / {
        return 404;
    }
}
