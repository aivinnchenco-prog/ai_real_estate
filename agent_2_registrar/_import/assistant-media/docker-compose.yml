services:
  curator:
    build:
      context: .
      dockerfile: Dockerfile.curator
    ports:
      - "8077:8077"
    environment:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8077/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  chain:
    build:
      context: .
      dockerfile: Dockerfile.chain
    depends_on:
      curator:
        condition: service_healthy
    environment:
      CURATOR_BASE_URL: http://curator:8077
      SEEDANCE_PROVIDER: cli
    volumes:
      - .:/app
      - chain-node-modules:/app/node_modules
      - higgsfield-cli:/root/.local
    restart: unless-stopped
    command: ["python3", "scripts/chain_runner.py", "--watch"]

volumes:
  chain-node-modules:
  higgsfield-cli:
